
services:
  postgres:
    image: postgres:15-alpine
    container_name: rcp_and_plan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcp_password}
      POSTGRES_DB: ${POSTGRES_DB:-rcp_and_plan_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: