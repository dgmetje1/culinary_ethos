
services:
  postgres:
    image: postgres:15-alpine
    container_name: culinary_ethos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-culinary_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culinary_password}
      POSTGRES_DB: ${POSTGRES_DB:-culinary_ethos_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: